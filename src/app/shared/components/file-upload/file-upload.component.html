<div class="file-drop-area">
  <button color="primary" mat-raised-button>Elige</button>
  <span>{{ file ? file.name : ' o arrastra y suelta aqui' }}</span>
  <input
    aria-autocomplete="none"
    autocomplete="nope"
    class="file-input" type="file">
  <button (click)="clearFile()" *ngIf="file" color="warn" mat-raised-button>Eliminar</button>
</div>
